[package]
name = "zeroclaw-super-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Independent-agent domain layer: Self and UserProfile cognition documents, Given-amendment negotiation, and self-amendment authority."
publish = false

[features]
default = []
# Compile-time gate for the developer self-amendment authority. Release builds
# never contain DeveloperAuthority or its entry points; see the design doc
# section on the double gate (compile-time feature + runtime switch).
dev-self-amendment = []

[dependencies]
# composition types only (RuntimeCapabilities capability sources); no runtime
# code is consumed or modified.
zeroclaw-runtime.workspace = true
zeroclaw-log.workspace = true
zeroclaw-spawn.workspace = true
zeroclaw-api.workspace = true
zeroclaw-config.workspace = true
zeroclaw-memory.workspace = true
zeroclaw-providers.workspace = true
anyhow = "1.0"
async-trait = "0.1"
cap-std = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "io-std"] }
toml = "1.0"

[dev-dependencies]
tempfile = "3.26"
zeroclaw-eval.workspace = true

# The product binary (袋鼠 / Kangaroo); distinct from the installed
# zeroclaw/zerocode/zerorelay binaries (infra::paths::BINARY_NAME).
[[bin]]
name = "kangaroo"
path = "src/bin/kangaroo/main.rs"
